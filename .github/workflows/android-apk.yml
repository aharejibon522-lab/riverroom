name: Build RiverRoom Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "style.css"
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  build:
    name: Build RiverRoom installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JavaScript dependencies
        working-directory: android-app
        run: npm install
      - name: Align Expo SDK dependencies
        working-directory: android-app
        run: npx expo install --fix
      - name: Reinstall aligned dependencies
        working-directory: android-app
        run: npm install
      - name: Generate Android project
        working-directory: android-app
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build debug APK
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: riverroom-android-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: riverroom-android-build-${{ github.run_number }}
          name: RiverRoom Poker Android build ${{ github.run_number }}
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
